# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# and iNZightVIT package coverage jobs (GTK4 system deps + xvfb).

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

name: test-coverage

permissions: read-all

jobs:
  test-coverage:
    runs-on: ubuntu-latest
    # Secrets live in the GitHub Environment named "codecov".
    environment: codecov

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-4-dev \
            gobject-introspection \
            libgirepository1.0-dev \
            pkg-config \
            xvfb

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          # Prefer GitHub remotes over CRAN for toolkit discovery + Rgtk4.
          extra-packages: |
            any::covr
            github::tmelliott/gWidgets2
            github::JanMarvin/Rgtk4
          needs: coverage

      # Plain xvfb-run avoids coactions/setup-xvfb (Node 20 + quote mangling).
      - name: Test coverage
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        run: |
          xvfb-run --auto-servernum Rscript -e 'covr::codecov(quiet = FALSE)'
